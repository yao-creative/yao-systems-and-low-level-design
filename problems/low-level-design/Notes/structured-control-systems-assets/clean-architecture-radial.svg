  <text class="label" x="200" y="284" text-anchor="middle">Presenters</text>

  <rect class="node" x="360" y="210" width="250" height="76" rx="18"/>
  <text class="label" x="485" y="245" text-anchor="middle">Use Cases /</text>
  <text class="label" x="485" y="273" text-anchor="middle">Application Layer</text>

  <rect class="node" x="650" y="120" width="220" height="76" rx="18"/>
  <text class="label" x="760" y="166" text-anchor="middle">Entities / Domain Core</text>

